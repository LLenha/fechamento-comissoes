<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento de Comissões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Tela de acesso. Identidade visual: Poppins, verde #367C4E, cinza claro #F5F5F5. */
:root{
  --bg:#FFFFFF; --surface:#F5F5F5; --ink:#2C2C2A; --muted:#888780; --line:#E5E5E5;
  --input:#E7E7E4; --accent:#367C4E; --accent-ink:#FFFFFF; --bad:#A42426; --bad-soft:#F7E3E3;
  --f:Poppins,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;
  display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{margin:0;font-size:1.45rem;font-weight:700;color:var(--accent);letter-spacing:-.01em;line-height:1.2}
.desc{margin:0;color:var(--muted);font-size:.88rem}
form{display:flex;flex-direction:column;gap:14px}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.pw{display:flex;align-items:center;background:var(--input);border:1px solid transparent;border-radius:8px}
.pw:focus-within{background:#fff;border-color:var(--accent)}
.pw input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;font:inherit;font-size:.95rem;color:var(--ink);outline:none}
.pw button{border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;padding:0 12px;cursor:pointer}
.pw button:hover{color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:.95rem;padding:11px 14px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.7;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:.84rem}
.foot{border-top:1px solid var(--line);padding-top:14px;font-size:.78rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box" id="tela" hidden>
  <div class="head">
    <span class="eyebrow">Comissões · Rede de lojas · Demonstração</span>
    <h1>Fechamento de Comissões</h1>
    <p class="desc">Acesso restrito. Informe a senha para continuar.</p>
  </div>
  <form id="f" autocomplete="off">
    <label class="lbl" for="senha">Senha
      <span class="pw"><input id="senha" type="password" autocomplete="current-password"><button type="button" id="ver" aria-label="Mostrar senha">Mostrar</button></span>
    </label>
    <label class="check" for="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste computador por 30 dias</label>
    <div class="err" id="err" role="alert" hidden></div>
    <button class="btn" id="entrar" type="submit">Entrar</button>
  </form>
  <div class="foot">Em caso de dúvida sobre o acesso, contate o responsável pelo fechamento.</div>
</main>
<script>
"use strict";
/* Conteúdo criptografado (AES-256-GCM). A chave é derivada da senha com PBKDF2-SHA256.
   Gerado por tools/publicar.ps1 — não editar manualmente. */
const CRIPTO = {iter:__ITER__, salt:"__SALT__", iv:"__IV__", dados:"__DADOS__"};
const CHAVE_LEMBRAR = 'fechamento-acesso';
const DIAS_LEMBRAR = 30;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const paraB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const $ = id => document.getElementById(id);

async function chaveDaSenha(senha){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(CRIPTO.salt), iterations:CRIPTO.iter}, base, 256);
}
async function abrir(bitsChave){
  const chave = await crypto.subtle.importKey('raw', bitsChave, 'AES-GCM', false, ['decrypt']);
  const html = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(CRIPTO.iv)}, chave, b64(CRIPTO.dados));
  return new TextDecoder().decode(html);
}
// Repassa ao aplicativo a chave derivada da senha (usada para os dados compartilhados) e troca a página.
function mostrarApp(html, bits){ window.__acesso = {mestre: paraB64(bits)}; document.open(); document.write(html); document.close(); }
function erro(msg){ const e=$('err'); e.textContent=msg; e.hidden=false; }

async function iniciar(){
  if(!window.crypto || !crypto.subtle){
    $('tela').hidden=false;
    erro('Este navegador não permite abrir o conteúdo protegido. Use uma versão atualizada do Chrome ou do Edge.');
    $('entrar').disabled=true; return;
  }
  // acesso lembrado neste computador
  try{
    const s = JSON.parse(localStorage.getItem(CHAVE_LEMBRAR) || 'null');
    if(s && s.expira > Date.now() && s.salt === CRIPTO.salt){
      try{ const bits=b64(s.chave); mostrarApp(await abrir(bits), bits); return; }
      catch(_){ localStorage.removeItem(CHAVE_LEMBRAR); }
    }
  }catch(_){}
  $('tela').hidden=false;
  $('senha').focus();
}

$('ver').onclick = e => {
  const i=$('senha'), v=i.type==='password';
  i.type = v ? 'text' : 'password';
  e.target.textContent = v ? 'Ocultar' : 'Mostrar';
  e.target.setAttribute('aria-label', v ? 'Ocultar senha' : 'Mostrar senha');
};
$('f').onsubmit = async e => {
  e.preventDefault();
  const senha=$('senha').value;
  if(!senha){ erro('Informe a senha.'); return; }
  const b=$('entrar'); b.disabled=true; b.textContent='Verificando...'; $('err').hidden=true;
  let html, bits;
  try{ bits = await chaveDaSenha(senha); html = await abrir(bits); }
  catch(_){
    b.disabled=false; b.textContent='Entrar';
    erro('Senha incorreta. Verifique e tente novamente.');
    $('senha').select(); return;
  }
  if($('lembrar').checked){
    try{ localStorage.setItem(CHAVE_LEMBRAR, JSON.stringify({chave:paraB64(bits), salt:CRIPTO.salt, expira:Date.now()+DIAS_LEMBRAR*864e5})); }catch(_){}
  }else{
    try{ localStorage.removeItem(CHAVE_LEMBRAR); }catch(_){}
  }
  mostrarApp(html, bits);
};
// Só substitui a página depois que ela terminar de carregar; antes disso, o navegador
// acrescentaria o aplicativo à tela de acesso em vez de trocá-la.
if(document.readyState === 'complete') iniciar();
else window.addEventListener('load', iniciar, {once:true});
</script>
</body>
</html>
